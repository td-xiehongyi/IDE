[package]
name = "ai-file-organizer"
version = "0.1.0"
description = "A Local First desktop file organizer"
edition = "2024"

[lints.rust]
linker_messages = "allow"

[lib]
name = "ai_file_organizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = [
    "compression",
    "dbus",
    "dynamic-acl",
    "wry",
    "x11",
] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
pdf-extract = "0.10"
quick-xml = "0.41"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }
