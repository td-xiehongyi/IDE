<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库 · 编辑器原型 draft-01</title>
<style>
:root{--bg:#f6f5f1;--paper:#fffefa;--ink:#292e29;--muted:#7a8178;--line:#e4e5dd;--accent:#416c51;--soft:#e9efe5;--radius:10px;--font:"Segoe UI","Microsoft YaHei",sans-serif;--space:16px}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px var(--font)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);padding:8px 12px}button:hover{background:var(--soft)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.primary{background:var(--accent);color:white;border-color:var(--accent)}header{height:58px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line)}.logo{background:var(--accent);color:white;padding:5px 9px;border-radius:7px;font-weight:700}small,.muted{color:var(--muted)}.spacer{flex:1}.demo{font-size:12px;color:#846434;background:#f6ecd7;border-radius:20px;padding:6px 12px}.shell{display:grid;grid-template-columns:244px minmax(320px,1fr) 266px;height:calc(100vh - 96px)}aside{padding:22px 16px;overflow:auto}aside.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.label{text-transform:uppercase;letter-spacing:1.4px;font-size:11px;color:var(--muted);margin:20px 0 12px}.vault{font-weight:650;font-size:16px}.search{width:100%;padding:10px;border:1px solid var(--line);background:var(--paper);border-radius:8px;margin:22px 0 5px}.note{width:100%;display:block;border:0;text-align:left;background:transparent;padding:10px 12px;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note.active{background:var(--soft);color:var(--accent);font-weight:600}.folder{color:var(--muted);font-size:12px;margin:15px 10px 6px}.mini{font-size:12px;padding:5px 8px}.row{display:flex;gap:6px;align-items:center}.main{display:flex;min-height:0;flex-direction:column;background:var(--paper)}.toolbar{height:57px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:8px}.path{font-size:12px;color:var(--muted);flex:1}.mode.selected{background:var(--soft);color:var(--accent)}.page{overflow:auto;flex:1;padding:36px clamp(24px,5vw,88px) 50px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;margin-bottom:18px}h1{font-size:32px;font-weight:650;letter-spacing:-1px;margin:12px 0 24px}h2{font-size:21px;margin:22px 0 10px}p{line-height:1.85;margin:10px 0}.block{padding:3px 6px;margin:8px -6px;min-height:25px;border-radius:6px}.block:hover{background:#f7f8f3}.block a{color:var(--accent);text-decoration:underline;text-underline-offset:4px;cursor:pointer}pre{background:#f2f3ec;border:1px solid var(--line);padding:16px;overflow:auto;border-radius:8px;line-height:1.7}blockquote{border-left:3px solid #9dae8f;margin:10px 0;padding:4px 18px;color:#68705e}textarea{width:100%;resize:vertical;min-height:80px;border:1px solid #a7b79e;border-radius:6px;padding:10px;background:#fcfdf8;line-height:1.8;color:var(--ink);font-family:Consolas,"Microsoft YaHei",monospace}.source{min-height:480px;border:0;background:transparent;resize:none}ul{line-height:2;padding-left:23px}.card{background:var(--paper);border:1px solid var(--line);padding:15px;border-radius:var(--radius);margin:12px 0}.card p{font-size:12px;margin-bottom:0}.linkitem{display:block;border:0;width:100%;text-align:left;padding:10px 0;background:transparent}.hint{font-size:12px;line-height:1.8;color:var(--muted)}.bottom{height:38px;border-top:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 20px;font-size:11px;color:var(--muted)}#status{color:var(--accent)}.notice{padding:10px 24px;background:#fff1d7;font-size:12px;line-height:1.8}.hidden{display:none!important}dialog{width:min(610px,90vw);max-height:80vh;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:26px;color:var(--ink)}dialog::backdrop{background:#202d244d}.modalactions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.historyitem{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}#toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);background:#293c2c;color:white;border-radius:9px;padding:12px 20px;box-shadow:0 5px 20px #0002;font-size:13px}.empty{padding:65px 20px;text-align:center;color:var(--muted)}@media(max-width:1100px){.shell{grid-template-columns:210px minmax(300px,1fr)}.right{display:none}.page{padding:25px 35px}}@media(max-width:720px){.shell{grid-template-columns:165px minmax(260px,1fr)}header{padding:0 12px}.demo{display:none}.toolbar{padding:0 12px}.page{padding:20px}.path{display:none}.bottom{gap:8px}.vault{font-size:14px}}
</style>
<header><span class="logo">知</span><strong>我的知识库</strong><span class="muted">/ 学习与思考</span><span class="spacer"></span><span class="demo">交互演示 · 虚构笔记 · 不写入真实文件</span><button id="reset" class="mini">重置演示</button></header>
<div class="shell"><aside class="left"><div class="vault">学习与思考 <small>⌄</small></div><small id="vaultStats">个人知识库 · 4 篇笔记</small><input id="search" class="search" placeholder="搜索笔记…" aria-label="搜索笔记"><div class="label">笔记空间</div><div id="tree"></div><div class="row" style="margin-top:20px"><button class="mini" id="newNote">＋ 笔记</button><button class="mini" id="newFolder">＋ 文件夹</button></div><div class="label">恢复</div><button class="note" id="history">◷ 版本历史</button><div class="hint">历史在切换、关闭或每 5 分钟生成检查点。内容未变不重复记录。</div></aside>
<main class="main"><div class="toolbar"><span class="path" id="path"></span><button class="mode mini selected" id="live">即时预览</button><button class="mode mini" id="sourceMode">源码</button><button class="mini" id="stateMenu">状态</button><button class="mini" id="checkpoint" title="模拟持续编辑 5 分钟">检查点演示</button></div><div id="notice" class="notice hidden"></div><div class="page" id="page"></div></main>
<aside class="right"><div class="label" style="margin-top:0">笔记联系</div><strong>反向链接</strong><div id="backlinks"></div><div class="label">当前笔记</div><div class="card"><div class="row"><span style="color:var(--accent)">●</span><strong>原文始终属于你</strong></div><p>即时预览与源码模式共享同一份 Markdown。</p></div><div class="card"><strong>AI 助理</strong><p>后续在这里提问和审阅修改。本轮先验证笔记编辑体验。</p><button disabled class="mini" style="margin-top:12px;cursor:default">尚未接入</button></div><div class="label">演示状态</div><select id="scenario" aria-label="演示状态" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:7px"><option value="normal">正常</option><option value="failure">保存失败</option><option value="conflict">外部修改冲突</option><option value="loading">加载中</option><option value="empty">空知识库</option></select><p class="hint">仅模拟交互。刷新或重置后恢复初始数据；不代表真实磁盘保存。</p></aside></div>
<div class="bottom"><span id="status" role="status" aria-live="polite">● 演示内容已就绪</span><span class="spacer"></span><span id="count"></span><span>Markdown · draft-01</span></div>
<dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modalactions"><button id="cancel">取消</button><button id="confirm" class="primary">确认</button></div></dialog><div id="toast" class="hidden" role="status"></div>
<script>
const initial=[{path:'coding/学习地图',text:'# 我的学习地图\n\n把零散的知识，变成可以重新找到的理解。这里记录学习过程中的问题、联系与下一步。\n\n## 从哪里开始\n\n先阅读 [[检索笔记]]，再用 [[复习指南]] 检查理解。点击笔记链接可以跳转；同名笔记会先让你选择。\n\n## 本周的三个问题\n\n- 我能用自己的话解释这个概念吗？\n- 它与已经学过的内容有什么联系？\n- 能否用一个小例子验证理解？\n\n> 不必一次整理完所有资料。先让今天的一个问题有清楚的答案。\n\n## 留给后续的表达\n\n公式源码：$L = (y - \\hat y)^2$\n\n```mermaid\ngraph LR\n  阅读 --> 理解 --> 实践 --> 复习\n```'},{path:'coding/检索笔记',text:'# 检索笔记\n\n检索的目标是找到能支持当前问题的资料，而不只是匹配几个词。\n\n## 三个观察角度\n\n- 标题与关键词\n- 资料所处的上下文\n- 是否存在可以核对的原文\n\n回到 [[学习地图]]，把这个概念放到完整学习路径中。'},{path:'coding/复习指南',text:'# 复习指南\n\n今天用十分钟回顾 [[检索笔记]]。\n\n## 练习\n\n先合上笔记解释检索，再打开原文检查遗漏。'},{path:'reading/复习指南',text:'# 阅读复习指南\n\n记录阅读后的三个收获，以及一个仍未解决的问题。'}];
let notes=structuredClone(initial),folders=['coding','reading'],active=0,mode='live',timer,scenario='normal',history={},pendingAction=null,composing=false;
const $=id=>document.getElementById(id), esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function initHistory(){history={};notes.forEach(n=>history[n.path]=[{text:n.text,label:'初始版本'}]);}initHistory();
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}
function dialog(title,body,action,label='确认'){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('confirm').textContent=label;pendingAction=action;$('modal').showModal()}
$('cancel').onclick=()=>$('modal').close();$('confirm').onclick=()=>{if(pendingAction&&pendingAction()===false)return;$('modal').close()};
function checkpoint(reason){if(scenario==='failure'||scenario==='conflict')return false;const n=notes[active],h=history[n.path]||(history[n.path]=[]);if(h.at(-1)?.text!==n.text){h.push({text:n.text,label:new Date().toLocaleTimeString()+' · '+reason});return true;}return false;}
function save(){clearTimeout(timer);if(composing)return;if(scenario==='failure'){$('status').textContent='保存失败 · 编辑内容仍保留';return}if(scenario==='conflict'){$('status').textContent='外部冲突 · 自动保存已暂停';return}$('status').textContent='● 已保存到演示内存';}
function updateText(text){notes[active].text=text;$('count').textContent=text.length+' 字符';$('status').textContent='有未保存的更改…';clearTimeout(timer);if(!composing)timer=setTimeout(save,1000);}
function switchNote(i){if(i===active)return;if(scenario==='failure'||scenario==='conflict'){toast('请先解决保存状态；演示中切回“正常”后重试');return}save();checkpoint('切换笔记');active=i;render();}
function renderTree(){const q=$('search').value.trim().toLowerCase();$('tree').innerHTML=folders.map(f=>'<div class="folder">⌄ '+esc(f)+'</div>'+notes.map((n,i)=>n.path.startsWith(f+'/')&&n.path.toLowerCase().includes(q)?'<button class="note '+(i===active?'active':'')+'" data-note="'+i+'">▤ '+esc(n.path.split('/').at(-1))+'</button>':'').join('')).join('');$('tree').querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>switchNote(+b.dataset.note));}
function inline(s){return esc(s).replace(/\[\[([^\]]+)\]\]/g,(_,name)=>'<a tabindex="0" role="link" data-link="'+esc(name)+'">'+esc(name.split('|').at(-1))+'</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function blockHTML(s){if(s.startsWith('```'))return '<pre>'+esc(s)+'</pre>';if(s.startsWith('# '))return '<h1>'+inline(s.slice(2))+'</h1>';if(s.startsWith('## '))return '<h2>'+inline(s.slice(3))+'</h2>';if(s.startsWith('> '))return '<blockquote>'+inline(s.slice(2))+'</blockquote>';if(s.startsWith('- '))return '<ul>'+s.split('\n').map(x=>'<li>'+inline(x.replace(/^- /,''))+'</li>').join('')+'</ul>';return '<p>'+inline(s).replaceAll('\n','<br>')+'</p>';}
function wireLinks(root){root.querySelectorAll('[data-link]').forEach(a=>{a.onclick=e=>{e.stopPropagation();openLink(a.dataset.link)};a.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();openLink(a.dataset.link)}}})}
function openLink(raw){if(scenario==='failure'||scenario==='conflict'){toast('请先解决当前保存状态');return}const name=raw.split('|')[0],matches=notes.map((n,i)=>({n,i})).filter(({n})=>name.includes('/')?n.path===name:n.path.split('/').at(-1)===name);if(!matches.length){toast('未找到笔记；不会自动创建');return}if(matches.length===1){switchNote(matches[0].i);return}dialog('选择同名笔记','<p class="hint">选择后将当前链接明确为含目录的路径。</p>'+matches.map(({n,i})=>'<label style="display:block;padding:12px"><input type="radio" name="target" value="'+i+'"> '+esc(n.path)+'.md</label>').join(''),()=>{const choice=document.querySelector('input[name="target"]:checked');if(!choice){toast('请选择一个笔记');return false}const idx=+choice.value;updateText(notes[active].text.replace('[['+raw+']]','[['+notes[idx].path+']]'));save();switchNote(idx);},'选择并打开')}
function render(){$('vaultStats').textContent='个人知识库 · '+notes.length+' 篇笔记';renderTree();$('path').textContent=notes[active].path+'.md';$('count').textContent=notes[active].text.length+' 字符';$('live').classList.toggle('selected',mode==='live');$('sourceMode').classList.toggle('selected',mode==='source');const p=$('page');if(scenario==='loading'){p.innerHTML='<div class="empty">正在读取演示笔记…</div>';return}if(scenario==='empty'){p.innerHTML='<div class="empty"><h2>从第一篇笔记开始</h2><p>左侧“＋ 笔记”可以创建一篇演示笔记。</p></div>';return}
if(mode==='source'){p.innerHTML='<div class="eyebrow">MARKDOWN / 源码模式</div><textarea aria-label="Markdown 源码" class="source" id="editor"></textarea>';$('editor').value=notes[active].text;$('editor').oninput=e=>updateText(e.target.value);$('editor').oncompositionstart=()=>{composing=true;clearTimeout(timer)};$('editor').oncompositionend=()=>{composing=false;updateText($('editor').value)};}
else{const blocks=notes[active].text.split('\n\n');p.innerHTML='<div class="eyebrow">PERSONAL KNOWLEDGE / 点击段落编辑</div>'+blocks.map((b,i)=>'<div class="block" tabindex="0" data-block="'+i+'">'+blockHTML(b)+'</div>').join('');p.querySelectorAll('[data-block]').forEach(b=>{function edit(){if(b.querySelector('textarea'))return;const i=+b.dataset.block;b.innerHTML='<textarea aria-label="编辑段落"></textarea>';const t=b.querySelector('textarea');t.value=blocks[i];t.style.height=Math.max(85,t.scrollHeight)+'px';t.focus();t.oncompositionstart=()=>{composing=true;clearTimeout(timer)};t.oncompositionend=()=>{composing=false;commit()};function commit(){blocks[i]=t.value;updateText(blocks.join('\n\n'));t.style.height='auto';t.style.height=t.scrollHeight+'px'}t.oninput=commit;t.onblur=()=>{blocks[i]=t.value;b.innerHTML=blockHTML(t.value);wireLinks(b)};}b.onclick=e=>{if(!e.target.closest('a'))edit()};b.onkeydown=e=>{if(e.key==='Enter'&&e.target===b){e.preventDefault();edit()}}});wireLinks(p);}
const name=notes[active].path.split('/').at(-1);const incoming=notes.map((n,i)=>({n,i})).filter(({n,i})=>i!==active&&(n.text.includes('[['+notes[active].path+']]')||(notes.filter(x=>x.path.split('/').at(-1)===name).length===1&&n.text.includes('[['+name+']]'))));$('backlinks').innerHTML=incoming.length?incoming.map(({n,i})=>'<button class="linkitem" data-back="'+i+'">↗ '+esc(n.path)+'</button>').join(''):'<p class="hint">暂无反向链接</p>';$('backlinks').querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>switchNote(+b.dataset.back));}
$('live').onclick=()=>{mode='live';render()};$('sourceMode').onclick=()=>{mode='source';render()};$('search').oninput=renderTree;
$('checkpoint').onclick=()=>{save();toast(checkpoint('5 分钟检查点（模拟）')?'已生成历史检查点':'内容未变或保存受阻，未新增版本')};
$('history').onclick=()=>{const h=history[notes[active].path]||[];dialog('版本历史 · '+notes[active].path,'<p class="hint">恢复前先查看旧内容；确认后产生新版本。</p>'+h.map((v,i)=>'<div class="historyitem"><span class="spacer">'+esc(v.label)+'</span><button data-version="'+i+'">查看版本</button></div>').join(''),null,'关闭');document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{const v=h[+b.dataset.version];$('modal').close();dialog('恢复版本预览','<small>当前内容</small><pre>'+esc(notes[active].text)+'</pre><small>待恢复内容</small><pre>'+esc(v.text)+'</pre>',()=>{if(scenario!=='normal'){toast('当前状态阻止恢复，请先解决冲突');return false}checkpoint('恢复前');updateText(v.text);save();checkpoint('恢复版本');render();toast('已恢复演示版本')},'确认恢复')});};
$('newFolder').onclick=()=>dialog('新建文件夹','<input id="nameInput" aria-label="文件夹名称" placeholder="例如：projects" style="width:100%;padding:10px">',()=>{const n=$('nameInput').value.trim();if(!n||/[\\/:*?"<>|]/.test(n)||folders.includes(n)){toast('请输入不重复的单层目录名');return false}folders.push(n);renderTree();toast('已创建演示文件夹')});
$('newNote').onclick=()=>dialog('新建 Markdown 笔记','<p class="hint">仅创建演示数据。</p><input id="nameInput" aria-label="笔记名称" placeholder="新笔记" style="width:100%;padding:10px">',()=>{const n=$('nameInput').value.trim();if(!n||/[\\/:*?"<>|]/.test(n)){toast('请输入合法笔记名');return false}const path=folders[0]+'/'+n;if(notes.some(x=>x.path===path)){toast('笔记已存在');return false}if(scenario==='conflict'||scenario==='failure'){toast('请先解决当前保存状态');return false}checkpoint('新建前切换');notes.push({path,text:'# '+n+'\n\n开始记录你的想法。'});history[path]=[{text:notes.at(-1).text,label:'创建版本'}];active=notes.length-1;scenario='normal';$('scenario').value='normal';setScenario();render()});
function setScenario(){$('notice').classList.toggle('hidden',scenario!=='failure'&&scenario!=='conflict');$('notice').textContent=scenario==='conflict'?'外部内容已变化。自动保存已暂停，当前编辑内容仍保留。此演示不进行真实合并。':'演示：磁盘保存失败。请保留编辑内容，切回“正常”后重试。';if(scenario==='normal')save();else if(scenario==='failure'||scenario==='conflict')save();render()}
$('stateMenu').onclick=()=>dialog('演示状态','<select id="stateChoice" aria-label="选择演示状态"><option value="normal">正常</option><option value="failure">保存失败</option><option value="conflict">外部修改冲突</option><option value="loading">加载中</option><option value="empty">空知识库</option></select>',()=>{scenario=$('stateChoice').value;$('scenario').value=scenario;setScenario()},'应用状态');
$('scenario').onchange=e=>{scenario=e.target.value;setScenario()};
$('reset').onclick=()=>{clearTimeout(timer);notes=structuredClone(initial);folders=['coding','reading'];active=0;scenario='normal';mode='live';$('scenario').value='normal';$('search').value='';initHistory();setScenario();toast('演示已重置')};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save();toast('已请求演示保存')}});setInterval(()=>{if(scenario==='normal')checkpoint('5 分钟检查点')},300000);render();
</script></html>
